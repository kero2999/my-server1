<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول — منصة التسويق التعليمية</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d1b2a">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="css/shared.css">
<style>
.auth-page{
  position:relative;min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:30px;
}
.auth-card{
  position:relative;z-index:10;
  width:100%;max-width:420px;
  padding:44px 36px;
  border-radius:24px;
  box-shadow:var(--shadow);
}
.auth-logo{
  display:flex;align-items:center;justify-content:center;gap:10px;
  margin-bottom:8px;
}
.auth-logo .logo-badge{
  width:52px;height:52px;border-radius:14px;
  background:linear-gradient(135deg,var(--gold),var(--secondary));
  display:flex;align-items:center;justify-content:center;
  font-size:1.4rem;color:var(--dark);
}
.auth-title{text-align:center;font-size:1.5rem;font-weight:900;margin:14px 0 6px;}
.auth-sub{text-align:center;color:var(--text-faint);font-size:0.88rem;margin-bottom:30px;}

.tabs{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:4px;margin-bottom:26px;}
.tab-btn{flex:1;padding:10px;border:none;background:transparent;border-radius:10px;color:var(--text-dim);font-weight:700;font-size:0.9rem;transition:all .25s;}
.tab-btn.active{background:linear-gradient(135deg,var(--gold),var(--secondary));color:var(--dark);}

.field{margin-bottom:16px;}
.field label{display:block;font-size:0.82rem;color:var(--text-dim);margin-bottom:7px;font-weight:700;}
.field input{
  width:100%;padding:13px 16px;border-radius:12px;
  background:var(--surface);border:1px solid var(--border);
  color:var(--text);font-size:0.95rem;outline:none;transition:all .25s;
}
.field input:focus{border-color:var(--gold);background:var(--surface-strong);}
.field-error{color:var(--danger);font-size:0.8rem;margin-top:6px;min-height:1.1em;}
.password-wrap{position:relative;}
.password-wrap input{padding-inline-end:44px;}
.password-toggle{
  position:absolute;top:50%;transform:translateY(-50%);
  inset-inline-end:14px;background:none;border:none;cursor:pointer;
  color:var(--text-faint);font-size:1rem;padding:4px;line-height:1;
}
.password-toggle:hover{color:var(--gold);}
.forgot-link{
  display:block;text-align:end;font-size:0.8rem;color:var(--text-faint);
  text-decoration:none;margin:-6px 0 16px;
}
.forgot-link:hover{color:var(--gold);}
.form-panel{display:none;}
.form-panel.active{display:block;}
.demo-note{
  margin-top:22px;padding:12px 16px;border-radius:12px;
  background:var(--surface);border:1px dashed var(--border);
  font-size:0.76rem;color:var(--text-faint);line-height:1.7;text-align:center;
}
.theme-toggle-abs{position:fixed;top:20px;left:20px;z-index:20;}
.trial-divider{display:flex;align-items:center;gap:12px;margin:26px 0 16px;color:var(--text-faint);font-size:0.8rem;}
.trial-divider::before, .trial-divider::after{content:'';flex:1;height:1px;background:var(--border);}
</style>
</head>
<body>

<div class="geo-bg">
  <div class="geo-shape geo-circle" style="width:220px;height:220px;top:8%;left:4%;"></div>
  <div class="geo-shape geo-square" style="width:110px;height:110px;top:70%;right:8%;animation-delay:2s;"></div>
  <div class="geo-shape geo-circle" style="width:160px;height:160px;top:35%;right:-3%;animation-delay:1s;"></div>
  <div class="geo-shape geo-triangle" style="top:80%;left:12%;animation-delay:3s;"></div>
</div>

<button class="icon-btn theme-toggle-abs" onclick="LMSTheme.toggleTheme()"><i class="fas fa-moon" data-theme-icon></i></button>

<div class="auth-page">
  <div class="auth-card surface-card">
    <div class="auth-logo">
      <div class="logo-badge"><i class="fas fa-graduation-cap"></i></div>
    </div>
    <div class="auth-title">منصة التسويق التعليمية</div>
    <div class="auth-sub">سجّل دخولك لمتابعة مقرر التسويق والتسويق الرقمي</div>

    <div class="tabs">
      <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">تسجيل الدخول</button>
      <button class="tab-btn" id="tabRegister" onclick="switchTab('register')">حساب جديد</button>
    </div>

    <!-- LOGIN -->
    <form class="form-panel active" id="loginPanel" onsubmit="return handleLogin(event)">
      <div class="field">
        <label>البريد الإلكتروني</label>
        <input type="email" id="loginEmail" autocomplete="email" required>
      </div>
      <div class="field">
        <label>كلمة المرور</label>
        <div class="password-wrap">
          <input type="password" id="loginPassword" autocomplete="current-password" required>
          <button type="button" class="password-toggle" onclick="togglePassword('loginPassword', this)" aria-label="إظهار كلمة المرور">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>
      <a href="forgot-password.html" class="forgot-link">نسيت كلمة السر؟</a>
      <div class="field-error" id="loginError"></div>
      <button type="submit" class="btn btn-primary btn-block">
        <i class="fas fa-right-to-bracket"></i> دخول
      </button>
    </form>

    <!-- REGISTER -->
    <form class="form-panel" id="registerPanel" onsubmit="return handleRegister(event)">
      <div class="field">
        <label>الاسم الكامل</label>
        <input type="text" id="regFullName" autocomplete="name" required>
      </div>
      <div class="field">
        <label>البريد الإلكتروني</label>
        <input type="email" id="regEmail" autocomplete="email" required>
      </div>
      <div class="field">
        <label>كلمة المرور</label>
        <div class="password-wrap">
          <input type="password" id="regPassword" autocomplete="new-password" required>
          <button type="button" class="password-toggle" onclick="togglePassword('regPassword', this)" aria-label="إظهار كلمة المرور">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>
      <div class="field-error" id="registerError"></div>
      <button type="submit" class="btn btn-primary btn-block">
        <i class="fas fa-user-plus"></i> إنشاء الحساب والبدء
      </button>
    </form>

    <div class="demo-note" id="modeNote">
      <i class="fas fa-circle-info"></i>
      هذا تسجيل دخول محلي تجريبي — بياناتك تُحفظ داخل هذا المتصفح فقط، ما يسمح بالعمل بدون إنترنت. لتفعيل حسابات متزامنة على كل الأجهزة والتحقق من الاشتراك، يلزم ربط باك-إند حقيقي.
    </div>

    <div class="trial-divider"><span>أو</span></div>

    <div id="trialPromptBox">
      <button class="btn btn-outline btn-block" id="trialOpenBtn" onclick="openTrialField()">
        <i class="fas fa-eye"></i> جرّب المحتوى مجانًا (١٠ دقائق)
      </button>
      <div class="field" id="trialNameField" style="display:none;margin-top:14px;">
        <label>اسمك (هيظهر كعلامة مائية على المحتوى)</label>
        <input type="text" id="trialName" placeholder="مثال: أحمد محمد">
        <button class="btn btn-primary btn-block" style="margin-top:10px;" onclick="startFreeTrial()">
          <i class="fas fa-play"></i> ابدأ المعاينة الآن
        </button>
      </div>
      <div class="field-error" id="trialError"></div>
    </div>
  </div>
</div>

<script src="js/theme.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/trial.js"></script>
<script>
  LMSAuth.redirectIfLoggedIn();
  if (LMSAuth.isRemote()) {
    document.getElementById('modeNote').innerHTML =
      '<i class="fas fa-circle-check" style="color:var(--success);"></i> حسابك متزامن ومحمي على سيرفر حقيقي، وحالة اشتراكك تُتحقّق تلقائيًا عبر Whop.';
  }

  function togglePassword(inputId, btn) {
    const input = document.getElementById(inputId);
    const icon = btn.querySelector('i');
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    icon.classList.toggle('fa-eye', !show);
    icon.classList.toggle('fa-eye-slash', show);
  }

  function switchTab(which) {
    document.getElementById('tabLogin').classList.toggle('active', which === 'login');
    document.getElementById('tabRegister').classList.toggle('active', which === 'register');
    document.getElementById('loginPanel').classList.toggle('active', which === 'login');
    document.getElementById('registerPanel').classList.toggle('active', which === 'register');
  }

  async function handleLogin(e) {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;
    const submitBtn = e.target.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    const res = await LMSAuth.login(email, password);
    submitBtn.disabled = false;
    const errEl = document.getElementById('loginError');
    if (!res.ok) { errEl.textContent = res.error; return false; }
    errEl.textContent = '';
    location.href = LMSAuth.isPaid() ? 'dashboard.html' : 'upgrade.html';
    return false;
  }

  async function handleRegister(e) {
    e.preventDefault();
    const fullName = document.getElementById('regFullName').value;
    const email = document.getElementById('regEmail').value;
    const password = document.getElementById('regPassword').value;
    const submitBtn = e.target.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    const res = await LMSAuth.register(fullName, email, password);
    submitBtn.disabled = false;
    const errEl = document.getElementById('registerError');
    if (!res.ok) { errEl.textContent = res.error; return false; }
    errEl.textContent = '';
    location.href = LMSAuth.isPaid() ? 'dashboard.html' : 'upgrade.html';
    return false;
  }

  function openTrialField() {
    document.getElementById('trialNameField').style.display = 'block';
    document.getElementById('trialOpenBtn').style.display = 'none';
  }

  function startFreeTrial() {
    const name = document.getElementById('trialName').value.trim();
    if (!name) {
      document.getElementById('trialError').textContent = 'من فضلك اكتب اسمك أولاً.';
      return;
    }
    LMSTrial.startTrial(name);
    location.href = 'ch1.html';
  }

  (function checkExistingTrial() {
    const status = LMSTrial.getStatus();
    const box = document.getElementById('trialPromptBox');
    if (!status.started) return;
    if (status.active) {
      box.innerHTML =
        '<a href="ch1.html" class="btn btn-primary btn-block"><i class="fas fa-play"></i> أكمل معاينتك المجانية (' +
        Math.ceil(status.remaining / 60) + ' د متبقية)</a>';
    } else {
      box.innerHTML =
        '<div class="demo-note" style="border-color:var(--danger);color:var(--danger);">لقد استخدمت فترتك التجريبية المجانية بالفعل.</div>' +
        '<a href="upgrade.html" class="btn btn-primary btn-block" style="margin-top:10px;"><i class="fas fa-cart-shopping"></i> اشترك الآن</a>';
    }
  })();
</script>
<script src="js/sw-register.js"></script>
</body>
</html>
