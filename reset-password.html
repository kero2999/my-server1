<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إعادة تعيين كلمة السر — منصة التسويق التعليمية</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d1b2a">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="css/shared.css">
<style>
.auth-page{
  position:relative;min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:30px;
}
.auth-card{
  position:relative;z-index:10;
  width:100%;max-width:420px;
  padding:44px 36px;
  border-radius:24px;
  box-shadow:var(--shadow);
}
.auth-logo{
  display:flex;align-items:center;justify-content:center;gap:10px;
  margin-bottom:8px;
}
.auth-logo .logo-badge{
  width:52px;height:52px;border-radius:14px;
  background:linear-gradient(135deg,var(--gold),var(--secondary));
  display:flex;align-items:center;justify-content:center;
  font-size:1.4rem;color:var(--dark);
}
.auth-title{text-align:center;font-size:1.4rem;font-weight:900;margin:14px 0 6px;}
.auth-sub{text-align:center;color:var(--text-faint);font-size:0.86rem;margin-bottom:30px;line-height:1.7;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:0.82rem;color:var(--text-dim);margin-bottom:7px;font-weight:700;}
.field input{
  width:100%;padding:13px 16px;border-radius:12px;
  background:var(--surface);border:1px solid var(--border);
  color:var(--text);font-size:0.95rem;outline:none;transition:all .25s;
}
.field input:focus{border-color:var(--gold);background:var(--surface-strong);}
.field-error{color:var(--danger);font-size:0.8rem;margin-top:6px;min-height:1.1em;}
.field-success{color:var(--success);font-size:0.85rem;margin-top:14px;line-height:1.7;text-align:center;}
.password-wrap{position:relative;}
.password-wrap input{padding-inline-end:44px;}
.password-toggle{
  position:absolute;top:50%;transform:translateY(-50%);
  inset-inline-end:14px;background:none;border:none;cursor:pointer;
  color:var(--text-faint);font-size:1rem;padding:4px;line-height:1;
}
.password-toggle:hover{color:var(--gold);}
.back-link{display:block;text-align:center;margin-top:20px;font-size:0.85rem;color:var(--text-faint);text-decoration:none;}
.back-link:hover{color:var(--gold);}
.theme-toggle-abs{position:fixed;top:20px;left:20px;z-index:20;}
</style>
</head>
<body>

<div class="geo-bg">
  <div class="geo-shape geo-circle" style="width:220px;height:220px;top:8%;left:4%;"></div>
  <div class="geo-shape geo-square" style="width:110px;height:110px;top:70%;right:8%;animation-delay:2s;"></div>
  <div class="geo-shape geo-circle" style="width:160px;height:160px;top:35%;right:-3%;animation-delay:1s;"></div>
  <div class="geo-shape geo-triangle" style="top:80%;left:12%;animation-delay:3s;"></div>
</div>

<button class="icon-btn theme-toggle-abs" onclick="LMSTheme.toggleTheme()"><i class="fas fa-moon" data-theme-icon></i></button>

<div class="auth-page">
  <div class="auth-card surface-card">
    <div class="auth-logo">
      <div class="logo-badge"><i class="fas fa-lock-open"></i></div>
    </div>
    <div class="auth-title">إعادة تعيين كلمة السر</div>
    <div class="auth-sub" id="pageSub">اكتب كلمة سر جديدة لحسابك.</div>

    <form id="resetForm" onsubmit="return handleReset(event)">
      <div class="field">
        <label>كلمة السر الجديدة</label>
        <div class="password-wrap">
          <input type="password" id="newPassword" autocomplete="new-password" required minlength="6">
          <button type="button" class="password-toggle" onclick="togglePassword('newPassword', this)" aria-label="إظهار كلمة المرور">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>
      <div class="field">
        <label>تأكيد كلمة السر</label>
        <div class="password-wrap">
          <input type="password" id="confirmPassword" autocomplete="new-password" required minlength="6">
          <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword', this)" aria-label="إظهار كلمة المرور">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>
      <div class="field-error" id="resetError"></div>
      <button type="submit" class="btn btn-primary btn-block" id="resetBtn">
        <i class="fas fa-check"></i> تحديث كلمة السر
      </button>
    </form>
    <div class="field-success" id="resetSuccess" style="display:none;">
      تم تحديث كلمة السر بنجاح. جارِ تحويلك لتسجيل الدخول...
    </div>

    <a href="index.html" class="back-link"><i class="fas fa-arrow-right"></i> رجوع لتسجيل الدخول</a>
  </div>
</div>

<script src="js/theme.js"></script>
<script src="js/config.js"></script>
<script>
  function togglePassword(inputId, btn) {
    const input = document.getElementById(inputId);
    const icon = btn.querySelector('i');
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    icon.classList.toggle('fa-eye', !show);
    icon.classList.toggle('fa-eye-slash', show);
  }

  const params = new URLSearchParams(location.search);
  const token = params.get('token');
  if (!token) {
    document.getElementById('resetForm').style.display = 'none';
    document.getElementById('pageSub').textContent = 'الرابط غير صالح أو ناقص. تأكد من استخدام نفس الرابط اللي وصلك بالإيميل.';
  }

  async function handleReset(e) {
    e.preventDefault();
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const errEl = document.getElementById('resetError');
    const btn = document.getElementById('resetBtn');

    if (newPassword !== confirmPassword) {
      errEl.textContent = 'كلمتا السر غير متطابقتين.';
      return false;
    }
    if (newPassword.length < 6) {
      errEl.textContent = 'كلمة المرور يجب أن تكون 6 أحرف على الأقل.';
      return false;
    }

    errEl.textContent = '';
    btn.disabled = true;
    try {
      const res = await fetch(API_BASE_URL + '/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, newPassword })
      });
      const data = await res.json();
      if (!data.ok) {
        errEl.textContent = data.error || 'حصل خطأ، حاول تطلب رابط جديد.';
        btn.disabled = false;
        return false;
      }
      document.getElementById('resetForm').style.display = 'none';
      document.getElementById('resetSuccess').style.display = 'block';
      setTimeout(() => { location.href = 'index.html'; }, 2500);
    } catch (err) {
      errEl.textContent = 'تعذّر الاتصال بالسيرفر، تأكد من اتصالك بالإنترنت.';
      btn.disabled = false;
    }
    return false;
  }
</script>
</body>
</html>
