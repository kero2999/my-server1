<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اشترك الآن — منصة التسويق التعليمية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="css/shared.css">
<style>
.upsell-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px;position:relative;z-index:5;}
.upsell-card{max-width:460px;width:100%;text-align:center;padding:46px 34px;border-radius:24px;box-shadow:var(--shadow);}
.upsell-icon{width:64px;height:64px;border-radius:18px;margin:0 auto 20px;
  background:linear-gradient(135deg,var(--gold),var(--secondary));
  display:flex;align-items:center;justify-content:center;font-size:1.6rem;color:var(--dark);}
.upsell-card h1{font-size:1.4rem;font-weight:900;margin-bottom:10px;}
.upsell-card p{color:var(--text-faint);font-size:0.92rem;margin-bottom:26px;line-height:1.8;}
.feature-list{text-align:right;margin-bottom:28px;display:flex;flex-direction:column;gap:12px;}
.feature-list div{display:flex;align-items:center;gap:10px;font-size:0.9rem;}
.feature-list i{color:var(--success);}
.upsell-actions{display:flex;flex-direction:column;gap:12px;}
</style>
</head>
<body>

<div class="geo-bg">
  <div class="geo-shape geo-circle" style="width:200px;height:200px;top:8%;left:4%;"></div>
</div>

<div class="upsell-wrap">
  <div class="upsell-card surface-card">
    <div class="upsell-icon"><i class="fas fa-graduation-cap"></i></div>
    <h1>وصلت لنهاية المعاينة المجانية</h1>
    <p>اشترك الآن للوصول الكامل والدائم لكل محتوى الكورس.</p>

    <div class="feature-list">
      <div><i class="fas fa-circle-check"></i> الوصول الكامل لكل الفصول التسعة بدون وقت محدود</div>
      <div><i class="fas fa-circle-check"></i> اختبارات كل فصل + شهادة إتمام معتمدة</div>
      <div><i class="fas fa-circle-check"></i> حفظ تقدّمك والعمل بدون إنترنت</div>
      <div><i class="fas fa-circle-check"></i> بدون علامة مائية أو قيود نسخ</div>
    </div>

    <div class="upsell-actions">
      <!-- 🔗 هيتم استبدال هذا الرابط برابط منتج/تشيك أوت Whop الحقيقي بعد ربط الحساب -->
      <a class="btn btn-primary btn-block" href="#" id="whopCheckoutLink">
        <i class="fas fa-cart-shopping"></i> اشترك الآن
      </a>
      <a class="btn btn-ghost btn-block" href="index.html">
        <i class="fas fa-right-to-bracket"></i> عندي حساب بالفعل
      </a>
    </div>
  </div>
</div>

</body>
</html>
